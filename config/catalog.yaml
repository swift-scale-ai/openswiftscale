  - {id: mai-thinking, name: MAI Thinking, publisher: Microsoft, capabilities: [text, reasoning], routeable: false, official_access: deployment, official_endpoint: "https://{resource}.services.ai.azure.com/mai/v1/chat/completions"}
  - {id: mai-image, name: MAI Image, publisher: Microsoft, capabilities: [image, vision], routeable: false, official_access: deployment, official_endpoint: "https://{resource}.services.ai.azure.com/mai/v1/images"}
  - {id: mai-voice, name: MAI Voice, publisher: Microsoft, capabilities: [speech], routeable: false, official_access: deployment, official_endpoint: "https://{region}.tts.speech.microsoft.com/cognitiveservices/v1"}
  - {id: mai-transcribe, name: MAI Transcribe, publisher: Microsoft, capabilities: [transcription], routeable: false, official_access: deployment, official_endpoint: "https://{resource}.cognitiveservices.azure.com/speechtotext/transcriptions:transcribe"}
  - {id: mistral, name: Mistral, publisher: Mistral AI, provider: mistral, capabilities: [text, code, reasoning], routeable: true}
  - {id: kimi, name: Kimi, publisher: Moonshot AI, provider: moonshot, capabilities: [text, vision, reasoning], routeable: true}
  - {id: laguna, name: Laguna, publisher: Poolside, provider: poolside, capabilities: [text, code, reasoning], routeable: true}
  - {id: step, name: Step, publisher: StepFun, provider: stepfun, capabilities: [text, vision, reasoning], routeable: true}


providers:
  - id: deepseek
    type: openai-compatible
    base_url: https://api.deepseek.com
  - id: xiaomi
    type: openai-compatible
    base_url: https://api.xiaomimimo.com
    authentication: api-key
    api_key_header: api-key
  - id: tencent
    type: openai-compatible
    base_url: https://tokenhub.tencentmaas.com
  - id: openai
    type: openai-compatible
    base_url: https://api.openai.com
  - id: nvidia
    type: openai-compatible
    base_url: https://integrate.api.nvidia.com
  - id: zai
    type: openai-compatible
    base_url: https://api.z.ai/api/paas/v4
    chat_path: /chat/completions
    responses_path: /responses
    embeddings_path: /embeddings
  - id: anthropic
    type: anthropic
    base_url: https://api.anthropic.com
    chat_path: /v1/messages
    authentication: x-api-key
    api_key_header: x-api-key
  - id: minimax
    type: openai-compatible
    base_url: https://api.minimax.io
  - id: qwen
    type: openai-compatible
    base_url: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
    chat_path: /chat/completions
    responses_path: /responses
    embeddings_path: /embeddings
  - id: gemini
    type: openai-compatible
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    chat_path: /chat/completions
    responses_path: /responses
    embeddings_path: /embeddings
  - id: meta-llama
    type: openai-compatible
    base_url: https://api.llama.com/compat/v1
    chat_path: /chat/completions
    responses_path: /responses
    embeddings_path: /embeddings
  - id: meta-model-api
    type: openai-compatible
    base_url: https://api.meta.ai/v1
    chat_path: /chat/completions
    responses_path: /responses
    embeddings_path: /embeddings
  - id: mistral
    type: openai-compatible
    base_url: https://api.mistral.ai/v1
    chat_path: /chat/completions
    responses_path: /responses
    embeddings_path: /embeddings
  - id: moonshot
    type: openai-compatible
    base_url: https://api.moonshot.ai/v1
    chat_path: /chat/completions
    responses_path: /responses
    embeddings_path: /embeddings
  - id: poolside
    type: openai-compatible
    base_url: https://inference.poolside.ai
  - id: stepfun
    type: openai-compatible
    base_url: https://api.stepfun.ai/step_plan/v1
    chat_path: /chat/completions
    responses_path: /responses
    embeddings_path: /embeddings

# Public model-family directory, verified against each publisher's official API
# catalog on 2026-08-29. routeable means this gateway already supports at least
# one protocol used by the family; it does not imply that an API key is configured.
